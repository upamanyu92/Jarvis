events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream vision_service  { server vision_service:8001; }
  upstream speech_service  { server speech_service:8002; }
  upstream agent_service   { server agent_service:8003; }
  upstream tts_service     { server tts_service:8004; }

  server {
    listen 80;

    # Frontend static files
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API routes
    location /api/vision/ {
      rewrite ^/api/vision/(.*)$ /$1 break;
      proxy_pass         http://vision_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    location /api/speech/ {
      rewrite ^/api/speech/(.*)$ /$1 break;
      proxy_pass         http://speech_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
      client_max_body_size 20M;
    }

    location /api/agent/ {
      rewrite ^/api/agent/(.*)$ /$1 break;
      proxy_pass         http://agent_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    location /api/tts/ {
      rewrite ^/api/tts/(.*)$ /$1 break;
      proxy_pass         http://tts_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }
  }
}
