version: "3.9"

services:
  # ── Vision Service ──────────────────────────────────────────────────────────
  vision_service:
    build: ./vision_service
    container_name: jarvis_vision
    restart: unless-stopped
    environment:
      - PORT=8001
    ports:
      - "8001:8001"
    networks:
      - jarvis_net

  # ── Speech Service ──────────────────────────────────────────────────────────
  speech_service:
    build: ./speech_service
    container_name: jarvis_speech
    restart: unless-stopped
    environment:
      - PORT=8002
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    ports:
      - "8002:8002"
    networks:
      - jarvis_net

  # ── Agent Service ───────────────────────────────────────────────────────────
  agent_service:
    build: ./agent_service
    container_name: jarvis_agent
    restart: unless-stopped
    environment:
      - PORT=8003
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - DATABASE_URL=sqlite:////data/jarvis_memory.db
    volumes:
      - agent_data:/data
    ports:
      - "8003:8003"
    depends_on:
      - ollama
    networks:
      - jarvis_net

  # ── TTS Service ─────────────────────────────────────────────────────────────
  tts_service:
    build: ./tts_service
    container_name: jarvis_tts
    restart: unless-stopped
    environment:
      - PORT=8004
      - TTS_LANGUAGE=${TTS_LANGUAGE:-en}
    ports:
      - "8004:8004"
    networks:
      - jarvis_net

  # ── Ollama LLM ──────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - jarvis_net

  # ── Frontend + Nginx Proxy ───────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: jarvis_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vision_service
      - speech_service
      - agent_service
      - tts_service
    networks:
      - jarvis_net

volumes:
  agent_data:
  ollama_data:

networks:
  jarvis_net:
    driver: bridge
